name: Build N1 firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gcc-multilib \
            g++-multilib gettext ncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget git curl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for Phicomm N1
        run: |
          # NOTE: OpenWrt ships scripts/config as a *directory* (kconfig sources),
          # not the Linux-kernel `scripts/config` helper. Write .config directly
          # and let `make defconfig` resolve dependencies.
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_mesongx=y
          CONFIG_TARGET_amlogic_mesongx_DEVICE_phicomm_n1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_KERNEL_KALLSYMS=y
          # Passed straight into the kernel .config by Kernel/Configure/Default
          # (the awk 'CONFIG_KERNEL_' -> 'CONFIG_' step), bypassing the
          # kconfig.pl merge where generic/config-6.12's
          # "# CONFIG_ARM64_PTR_AUTH is not set" can shadow the subtarget.
          CONFIG_KERNEL_ARM64_PTR_AUTH=y
          CONFIG_KERNEL_ARM64_PTR_AUTH_KERNEL=y
          EOF
          make defconfig
          # generic/config-6.12 ships "# CONFIG_ARM64_PTR_AUTH is not set".
          # If that value survives the kernel config merge, syncconfig
          # re-asks ARM64_PTR_AUTH and ARM64_PTR_AUTH_KERNEL becomes a NEW
          # symbol -> non-tty abort. Enable it at the generic layer.
          sed -i 's/^# CONFIG_ARM64_PTR_AUTH is not set$/CONFIG_ARM64_PTR_AUTH=y/' target/linux/generic/config-6.12
          echo "::notice::diagnostic config-6.12:"; grep "ARM64_PTR_AUTH" target/linux/amlogic/mesongx/config-6.12 || true
          echo "::notice::diagnostic merged:"
          scripts/kconfig.pl + + target/linux/generic/config-6.12 target/linux/amlogic/config-6.12 target/linux/amlogic/mesongx/config-6.12 | grep "ARM64_PTR_AUTH" || true

      - name: Build image
        run: |
          set +e
          # config-6.12 was copied from config-6.6 and misses 6.12-new symbols,
          # so the kernel's syncconfig aborts on a non-tty (NEW) prompt in the
          # first build. A pre-build `make kernel_oldconfig` is NOT viable: it
          # drags in the whole toolchain and times out before the kernel tree
          # exists (LINUX_DIR empty). Instead let the normal build reach the
          # syncconfig failure -- by then the kernel tree IS prepared and
          # LINUX_DIR/.config exists -- then fill defaults with olddefconfig.
          make -j$(nproc)
          rc=$?
          if [ $rc -ne 0 ]; then
            LINUX_DIR=$(ls -d build_dir/target-*/linux-amlogic_mesongx/linux-* 2>/dev/null | head -1)
            echo "::notice::first build rc=$rc, LINUX_DIR=$LINUX_DIR"
            if [ -n "$LINUX_DIR" ] && [ -f "$LINUX_DIR/.config" ]; then
              echo "::notice::filling 6.12 NEW symbols with olddefconfig"
              make -C "$LINUX_DIR" ARCH=arm64 olddefconfig || { echo "::error::olddefconfig failed"; exit $rc; }
              echo "::notice::diagnostics: ARM64_PTR_AUTH in filled .config:"
              grep "ARM64_PTR_AUTH" "$LINUX_DIR/.config" || echo "(none)"
              grep -E '^(CONFIG_|# CONFIG_)' "$LINUX_DIR/.config" \
                | grep -vE '^(# )?CONFIG_(KERNEL_|INITRAMFS)' \
                > target/linux/amlogic/mesongx/config-6.12
              echo "::notice::diagnostics: ARM64_PTR_AUTH in config-6.12:"
              grep "ARM64_PTR_AUTH" target/linux/amlogic/mesongx/config-6.12 || echo "(none)"
              # Force Kernel/Configure to rebuild .config from the now-filled
              # subtarget file; otherwise the stale .config.prev makes Configure
              # skip the copy and the old (incomplete) .config is reused.
              rm -f "$LINUX_DIR/.configured" "$LINUX_DIR/.config.prev"
              echo "::notice::retrying build with normalized kernel config"
              make -j$(nproc)
              rc=$?
            fi
          fi
          if [ $rc -ne 0 ]; then
            echo "::error::make failed (exit $rc). Re-running with V=s."
            make -j1 V=s 2>&1 | tee /tmp/vs.log | tail -150
            exit $rc
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-amlogic-mesongx-phicomm-n1
          path: |
            bin/targets/amlogic/mesongx/*
            !bin/targets/amlogic/mesongx/*.buildinfo
            !bin/targets/amlogic/mesongx/*.manifest
          if-no-files-found: error

      - name: Release (draft, on tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          files: bin/targets/amlogic/mesongx/*