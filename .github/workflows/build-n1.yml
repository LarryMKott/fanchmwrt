name: Build N1 firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gcc-multilib \
            g++-multilib gettext ncurses-dev libssl-dev \
            python3-distutils python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget git curl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for Phicomm N1
        run: |
          make defconfig
          # Start from a minimal config then enable amlogic/mesongx/phicomm_n1
          echo "CONFIG_TARGET_amlogic=y" >> .config
          echo "CONFIG_TARGET_amlogic_mesongx=y" >> .config
          echo "CONFIG_TARGET_amlogic_mesongx_DEVICE_phicomm_n1=y" >> .config
          echo "CONFIG_KERNEL_KALLSYMS=y" >> .config
          scripts/config --file .config \
            -e CONFIG_TARGET_amlogic \
            -e CONFIG_TARGET_amlogic_mesongx \
            -e CONFIG_TARGET_amlogic_mesongx_DEVICE_phicomm_n1 \
            -e CONFIG_PACKAGE_luci \
            -e CONFIG_LUCI_LANG_zh_Hans
          make defconfig

      - name: Build image
        run: make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-amlogic-mesongx-phicomm-n1
          path: |
            bin/targets/amlogic/mesongx/*
            !bin/targets/amlogic/mesongx/*.buildinfo
            !bin/targets/amlogic/mesongx/*.manifest
          if-no-files-found: error

      - name: Release (draft, on tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          files: bin/targets/amlogic/mesongx/*