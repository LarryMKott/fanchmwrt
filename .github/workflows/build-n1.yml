name: Build N1 firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gcc-multilib \
            g++-multilib gettext ncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget git curl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for Phicomm N1
        run: |
          # NOTE: OpenWrt ships scripts/config as a *directory* (kconfig sources),
          # not the Linux-kernel `scripts/config` helper. Write .config directly
          # and let `make defconfig` resolve dependencies.
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_mesongx=y
          CONFIG_TARGET_amlogic_mesongx_DEVICE_phicomm_n1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_KERNEL_KALLSYMS=y
          EOF
          make defconfig

      - name: Fill kernel 6.12 config defaults
        run: |
          # config-6.12 is a straight copy of config-6.6 and therefore misses
          # every symbol added in 6.12. `kernel_oldconfig` fills most of them
          # but cannot answer choice-type NEW prompts (e.g.
          # TRANSPARENT_HUGEPAGE_NEVER asks choice[1-3?] and an empty line is
          # invalid). `olddefconfig` takes the Kconfig defaults non-interactively.
          yes "" | make kernel_oldconfig || true
          LINUX_DIR=$(ls -d build_dir/target-*/linux-amlogic_mesongx/linux-* 2>/dev/null | head -1)
          echo "LINUX_DIR=$LINUX_DIR"
          make -C "$LINUX_DIR" ARCH=arm64 olddefconfig
          # Persist the filled config back into the subtarget file, keeping only
          # config lines and dropping entries OpenWrt injects at build time.
          grep -E '^(CONFIG_|# CONFIG_)' "$LINUX_DIR/.config" \
            | grep -vE '^(# )?CONFIG_(KERNEL_|INITRAMFS)' \
            > target/linux/amlogic/mesongx/config-6.12

      - name: Build image
        run: |
          set +e
          make -j$(nproc)
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::make failed (exit $rc). Re-running failed target with V=s to capture the real error."
            make -j1 V=s 2>&1 | tee /tmp/vs.log | tail -150
            exit $rc
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-amlogic-mesongx-phicomm-n1
          path: |
            bin/targets/amlogic/mesongx/*
            !bin/targets/amlogic/mesongx/*.buildinfo
            !bin/targets/amlogic/mesongx/*.manifest
          if-no-files-found: error

      - name: Release (draft, on tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          files: bin/targets/amlogic/mesongx/*