name: Build N1 firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gcc-multilib \
            g++-multilib gettext ncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget git curl

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for Phicomm N1
        run: |
          # NOTE: OpenWrt ships scripts/config as a *directory* (kconfig sources),
          # not the Linux-kernel `scripts/config` helper. Write .config directly
          # and let `make defconfig` resolve dependencies.
          rm -f .config
          cat > .config <<'EOF'
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_mesongx=y
          CONFIG_TARGET_amlogic_mesongx_DEVICE_phicomm_n1=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_KERNEL_KALLSYMS=y
          EOF
          make defconfig

      - name: Fill kernel 6.12 config defaults
        run: |
          # config-6.12 is a straight copy of config-6.6 and therefore misses
          # every symbol added in 6.12 (e.g. PTDUMP_STAGE2_DEBUGFS). OpenWrt's
          # Kernel/Configure does NOT run olddefconfig, so those show up as
          # interactive (NEW) prompts and syncconfig aborts in a non-tty CI.
          # Seed them from the kernel Kconfig defaults; kernel_oldconfig also
          # writes the diff back into the subtarget config-6.12.
          yes "" | make kernel_oldconfig

      - name: Build image
        run: |
          set +e
          make -j$(nproc)
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::make failed (exit $rc). Re-running failed target with V=s to capture the real error."
            make -j1 V=s 2>&1 | tee /tmp/vs.log | tail -150
            exit $rc
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-amlogic-mesongx-phicomm-n1
          path: |
            bin/targets/amlogic/mesongx/*
            !bin/targets/amlogic/mesongx/*.buildinfo
            !bin/targets/amlogic/mesongx/*.manifest
          if-no-files-found: error

      - name: Release (draft, on tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          files: bin/targets/amlogic/mesongx/*