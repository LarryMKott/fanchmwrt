# Watch the upstream repo and rebuild the Phicomm N1 firmware when it moves.
# Author: 咖啡有毒你还喝！
#
# Version-scoped by design: today only the 25.12 series is built. To extend to
# another release series later, add one line to N1_VERSIONS below and make sure
# the matching ported branch exists. Everything else (upstream check, dedup,
# merge, build, release) is already series-agnostic.
#
# Flow: for every configured "<series>|<branch>":
#   1. read upstream HEAD of that branch
#   2. skip when a release for that exact upstream commit already exists
#   3. otherwise merge upstream into the ported branch and build it
#   4. publish a pre-release tagged n1-<series>-<YYYYMMDD>-<short sha>
name: Auto-build N1 on upstream update

on:
  schedule:
    # Every day at 18:00 UTC = 02:00 Asia/Shanghai
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      series:
        description: "Only build this series (empty = all configured)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: n1-auto-build
  cancel-in-progress: false

env:
  # ---- Version matrix: one line per OpenWrt series you have ported. ----
  # Format: "<series>|<ported branch>"
  # Only 25.12 for now; future versions are added here, nowhere else.
  N1_VERSIONS: |
    25.12|fanchmwrt-25.12.6

jobs:
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Decide which series need a build
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_SERIES: ${{ inputs.series }}
        run: |
          set -euo pipefail
          matrix='[]'
          count=0

          while IFS='|' read -r series branch; do
            series="$(echo "${series:-}" | xargs)"
            branch="$(echo "${branch:-}" | xargs)"
            [ -z "$series" ] && continue
            [ -z "$branch" ] && continue
            if [ -n "${ONLY_SERIES:-}" ] && [ "$series" != "$ONLY_SERIES" ]; then
              echo "skip $series: filtered out by input"
              continue
            fi

            if ! sha=$(gh api "repos/fanchmwrt/fanchmwrt/commits/$branch" --jq .sha 2>/dev/null); then
              echo "::warning::upstream branch '$branch' not found (series $series); skipping"
              continue
            fi
            short=${sha:0:8}
            tag="n1-$series-$(date -u +%Y%m%d)-$short"
            echo "series=$series branch=$branch upstream=$sha tag=$tag"

            if gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                 --json tagName --jq '.[].tagName' \
               | grep -qE "^n1-$series-.*-$short\$"; then
              echo "  already released for $short -> skip"
              continue
            fi

            echo "  queued"
            matrix=$(jq -c \
              --arg s "$series" --arg b "$branch" --arg t "$tag" \
              '. + [{series: $s, branch: $b, tag: $t}]' <<< "$matrix")
            count=$((count + 1))
          done <<< "$N1_VERSIONS"

          echo "matrix=$matrix"  >> "$GITHUB_OUTPUT"
          echo "count=$count"    >> "$GITHUB_OUTPUT"
          echo "planned $count build(s): $matrix"

  build:
    name: Build ${{ matrix.series }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-n1.yml
    with:
      branch: ${{ matrix.branch }}
      release_tag: ${{ matrix.tag }}
    secrets: inherit
