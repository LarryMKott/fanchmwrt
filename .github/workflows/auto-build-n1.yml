# Watch the upstream repo and rebuild the Phicomm N1 firmware when it moves.
# Author: 咖啡有毒你还喝！
#
# Flow: check upstream HEAD -> if a release for that commit does not exist yet,
# merge upstream into our ported branch, then call build-n1.yml which builds the
# N1 image and publishes a pre-release tagged n1-<YYYYMMDD>-<short sha>.
name: Auto-build N1 on upstream update

on:
  schedule:
    # Every day at 18:00 UTC = 02:00 Asia/Shanghai
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n1-auto-build
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream and decide
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout ported branch
        uses: actions/checkout@v6
        with:
          ref: fanchmwrt-25.12.6
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/fanchmwrt/fanchmwrt.git 2>/dev/null || true
          git fetch --no-tags upstream fanchmwrt-25.12.6

      - name: Decide, merge upstream, and emit build tag
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse upstream/fanchmwrt-25.12.6)
          short=${sha:0:8}
          date=$(date -u +%Y%m%d)
          tag="n1-$date-$short"
          echo "upstream HEAD = $sha (short $short), candidate tag = $tag"

          # Skip only when a release for this exact upstream commit already exists.
          # A failed build leaves no release, so the next run retries it.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
               --json tagName --jq '.[].tagName' \
             | grep -q -- "-$short\$"; then
            echo "already released for $short -> nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bring our ported branch up to the upstream commit when needed.
          if git merge-base --is-ancestor "$sha" HEAD; then
            echo "upstream already merged; rebuilding (previous build likely failed)"
          else
            echo "merging upstream $sha into fanchmwrt-25.12.6"
            git config user.name "咖啡有毒你还喝！"
            git config user.email "noreply@github.com"
            if ! git merge --no-edit "$sha"; then
              echo "::error::merge conflict while syncing upstream — manual resolution required"
              exit 1
            fi
            git push origin HEAD:fanchmwrt-25.12.6
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"      >> "$GITHUB_OUTPUT"

  build:
    name: Build and release
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/build-n1.yml
    with:
      release_tag: ${{ needs.sync.outputs.tag }}
    secrets: inherit
